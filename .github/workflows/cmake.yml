name: RacingSimulator

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S RacingSimulator -B build

      - name: Build
        run: cmake --build build --config Release